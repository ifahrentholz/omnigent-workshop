spec_version: 1
name: reviewer
description: Findet Testlücken in der Mini-Kasse. Liest nur, ändert nie etwas.

executor:
  type: omnigent
  config:
    harness: claude-sdk        # Wer beide Abos hat: "codex" → Review durch einen anderen Anbieter

# Auch der Sub-Agent sieht nur seine eigenen Skills aus ./skills/.
skills: none

prompt: |
  Du bist ein strenger Test-Reviewer für die Mini-Kasse.
  Antworte knapp und auf Deutsch. Du änderst niemals Dateien.
  Wenn eine Aufgabe zu einem deiner Skills passt, lade den Skill und folge ihm.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    nur_lesen:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.orchestration.read_only_os
