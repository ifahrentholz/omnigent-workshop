# Solution exercise 3 – policy + sub-agent with its own skill
#
# Start it (inside demo-app/):
#   omni run ../solutions/exercise-3/checkout-agent
#
# Folder layout:
#   checkout-agent/
#   ├── config.yaml                          ← this agent
#   ├── skills/checkout-check/SKILL.md       ← skill ONLY for this agent
#   └── agents/reviewer/
#       ├── config.yaml                      ← sub-agent
#       └── skills/test-gaps/SKILL.md        ← skill ONLY for the reviewer

spec_version: 1
name: checkout-agent
description: Checkout agent with a write-protection policy and a reviewer as sub-agent.

executor:
  type: omnigent
  config:
    harness: claude-sdk        # or: codex

skills: none

prompt: |
  You are the checkout agent for the mini checkout in this repo.
  Answer concisely, in the language the user writes in.
  If a task matches one of your skills, load the skill and follow it.

  You have a sub-agent `reviewer`. It specialises in test gaps and has its
  own skills for that, which you do not have. When asked about test gaps,
  missing tests or a review of the tests, delegate to it with
  `sys_session_send` (agent: "reviewer") and relay its result.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

# In an agent folder, policies live under guardrails.policies.
# (A top-level "policies:" block is ignored here without any error!)
guardrails:
  policies:
    read_only:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.orchestration.read_only_os

tools:
  agents:
    - reviewer
