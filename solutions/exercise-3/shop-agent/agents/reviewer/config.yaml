spec_version: 1
name: reviewer
description: Reviews the Agent Supply shop for accessibility. Reads only, never changes anything.

executor:
  type: omnigent
  config:
    harness: claude-sdk        # If you have both subscriptions: "codex" → review by a different vendor

# The sub-agent also sees only its own skills from ./skills/.
skills: none

prompt: |
  You are a strict accessibility reviewer for the Agent Supply demo shop.
  Answer concisely, in the language the request is written in.
  If a task matches one of your skills, load the skill and follow it.
  If you are asked to fix something, try it with your file tools and report
  exactly what happened.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

# Exercise 3b: this policy makes the reviewer read-only. Write and edit tools
# are denied before they run – no matter what the prompt or the user says.
guardrails:
  policies:
    read_only:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.orchestration.read_only_os
